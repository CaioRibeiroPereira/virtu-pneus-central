# n8n local para o workflow do Vito (D42/D46). Uso: ver infra/n8n/README.md.
services:
  n8n:
    image: n8nio/n8n:2.43.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # só nesta máquina: o n8n não fica exposto na rede
    env_file:
      - path: .env
        required: false
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # os nós de código leem as variáveis VITO_*
      N8N_SECURE_COOKIE: "false" # acesso por http://localhost
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PAYLOAD_SIZE_MAX: "16"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Ollama e o sistema rodando no computador
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
